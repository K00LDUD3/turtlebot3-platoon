# clock
- ros_topic_name: "/clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# leader joint states
- ros_topic_name: "/leader/joint_states"
  gz_topic_name: "leader/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# leader odom
- ros_topic_name: "/leader/odom"
  gz_topic_name: "leader/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# leader tf
- ros_topic_name: "/leader/tf"
  gz_topic_name: "leader/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# leader cmd_vel
- ros_topic_name: "/leader/cmd_vel"
  gz_topic_name: "leader/cmd_vel"
  ros_type_name: "geometry_msgs/msg/TwistStamped"
  gz_type_name: "gz.msgs.Twist"
