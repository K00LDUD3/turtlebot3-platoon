# follower joint states
- ros_topic_name: "/follower/joint_states"
  gz_topic_name: "follower/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# follower odom
- ros_topic_name: "/follower/odom"
  gz_topic_name: "follower/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# follower tf
- ros_topic_name: "/follower/tf"
  gz_topic_name: "follower/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# follower cmd_vel
- ros_topic_name: "/follower/cmd_vel"
  gz_topic_name: "follower/cmd_vel"
  ros_type_name: "geometry_msgs/msg/TwistStamped"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# follower imu
- ros_topic_name: "/follower/imu"
  gz_topic_name: "follower/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# follower scan
- ros_topic_name: "/follower/scan"
  gz_topic_name: "follower/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS
